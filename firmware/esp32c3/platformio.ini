; ESP32-C3 开发板固件（INMP441 数字麦 + MAX98357 功放）
; 与智能眼镜 APP 的 BoardProtocol 一一对应：
;   服务  4fafc201-1fb5-459e-8fcc-c5c9c331914b
;   控制  beb5483e-36e1-4688-b7f5-ea07361b26a8  READ / WRITE / WRITE_NR / NOTIFY
;   上行  66666666-6666-6666-6666-666666666666  READ / NOTIFY          16 kHz 单声道 int16
;   下行  88888888-8888-8888-8888-888888888888  READ / WRITE / WRITE_NR / NOTIFY
;
; 构建：pio run
; 烧录：pio run -t upload
; 监视：pio device monitor -b 115200
;
; 平台固定在已实测的 7.0.1（arduino-esp32 core 3.2.0 / ESP-IDF5）。
; 不要随意抬高：BLE 与 legacy I2S 在这条版本线上验证过，换核心版本可能改 API。
[env:esp32-c3-devkitc-02]
platform = espressif32@7.0.1
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; MIC_DETECTION_ENABLED=0 时完全编译掉麦克风存在性检测，等价于始终发送上行。
; 运行时也可用控制指令 mic:auto / mic:force / mic:off 切换（见 main.cpp）。
build_flags =
    -DMIC_DETECTION_ENABLED=1

; 备用构建：完全去掉麦克风存在性检测，始终发送上行音频。
; 构建：pio run -e esp32-c3-no-mic-detect
[env:esp32-c3-no-mic-detect]
extends = env:esp32-c3-devkitc-02
build_flags =
    -DMIC_DETECTION_ENABLED=0
